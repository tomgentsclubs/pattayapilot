name: Daily Events Digest

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily digest
        run: |
          curl -f "https://gentsclubs-events-bot.thailandfordy.workers.dev/daily?secret=${{ secrets.CRON_SECRET }}"
